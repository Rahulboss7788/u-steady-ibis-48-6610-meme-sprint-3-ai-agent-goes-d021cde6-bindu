<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Out of Office Forever</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 1024px; overflow: hidden; font-family: "Arial Black", Arial, sans-serif; background: #111; }
  .band {
    height: 190px; background: #000; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; line-height: 1.05;
  }
  .band .t1 { font-size: 62px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
  .band .t2 { font-size: 62px; font-weight: 900; letter-spacing: 1px; color: #ffd23f; }
  .band.bottom .t1 { font-size: 56px; }
  .band.bottom .t2 { font-size: 56px; }
  .scene { position: relative; height: 644px; background: linear-gradient(180deg, #ff9a3d 0%, #ff6b6b 55%, #c94b7c 100%); overflow: hidden; }
  .sun { position: absolute; width: 180px; height: 180px; border-radius: 50%; background: #ffe66d; top: 40px; right: 70px; box-shadow: 0 0 60px 20px rgba(255, 230, 109, 0.7); }
  .cloud { position: absolute; background: #fff; border-radius: 40px; opacity: 0.9; }
  .cloud.c1 { width: 150px; height: 46px; top: 60px; left: 60px; }
  .cloud.c2 { width: 110px; height: 36px; top: 150px; left: 210px; }
  .cloud.c3 { width: 130px; height: 40px; top: 40px; left: 480px; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #7a4a21; }
  .runway { position: absolute; left: 0; right: 0; bottom: 118px; height: 14px; background: #3a3a3a; }
  .runway::after { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 4px;
    background: repeating-linear-gradient(90deg, #fff 0 40px, transparent 40px 80px); }
  svg { position: absolute; inset: 0; }
  .bubble {
    position: absolute; top: 30px; left: 330px; background: #fff; color: #111;
    border: 4px solid #111; border-radius: 24px; padding: 18px 26px;
    font-size: 40px; font-weight: 900; line-height: 1.1; text-align: center;
  }
  .bubble::after {
    content: ""; position: absolute; left: 60px; bottom: -24px;
    border: 14px solid transparent; border-top-color: #111; border-left-color: #111;
  }
</style>
</head>
<body>
  <div class="band">
    <div class="t1">ASKED MY AGENT TO</div>
    <div class="t2">BOOK ONE MEETING</div>
  </div>

  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="ground"></div>
    <div class="runway"></div>

    <svg width="1024" height="644" viewBox="0 0 1024 644" xmlns="http://www.w3.org/2000/svg">
      <!-- plane flying away top right -->
      <g transform="translate(760,120) rotate(12)" fill="#fff">
        <ellipse cx="0" cy="0" rx="90" ry="22"/>
        <polygon points="10,-18 70,-58 84,-48 30,0" />
        <polygon points="10,18 70,58 84,48 30,0" />
        <polygon points="-70,-10 -95,-30 -80,-4" />
        <polygon points="-70,10 -95,30 -80,4" />
      </g>
      <!-- calendar page with red X -->
      <g transform="translate(120,330)">
        <rect x="0" y="0" width="170" height="150" rx="10" fill="#fff" stroke="#111" stroke-width="5"/>
        <rect x="0" y="0" width="170" height="38" rx="10" fill="#e63946"/>
        <circle cx="48" cy="19" r="5" fill="#111"/><circle cx="122" cy="19" r="5" fill="#111"/>
        <text x="85" y="95" font-size="72" font-weight="900" fill="#e63946" text-anchor="middle" font-family="Arial Black, Arial, sans-serif">X</text>
        <text x="85" y="135" font-size="24" font-weight="900" fill="#111" text-anchor="middle" font-family="Arial Black, Arial, sans-serif">MEETING</text>
      </g>
      <!-- suitcase -->
      <g transform="translate(700,420)">
        <rect x="0" y="30" width="190" height="140" rx="14" fill="#0e7c7b" stroke="#111" stroke-width="5"/>
        <rect x="0" y="30" width="190" height="22" rx="10" fill="#0a5c5b"/>
        <rect x="78" y="8" width="34" height="26" rx="8" fill="none" stroke="#111" stroke-width="6"/>
        <rect x="86" y="86" width="18" height="14" rx="3" fill="#ffd23f" stroke="#111" stroke-width="3"/>
        <line x1="95" y1="30" x2="95" y2="170" stroke="#111" stroke-width="4"/>
      </g>
      <!-- robot agent -->
      <g transform="translate(400,180)">
        <!-- body -->
        <rect x="30" y="210" width="220" height="180" rx="26" fill="#c0c7cf" stroke="#111" stroke-width="6"/>
        <rect x="30" y="210" width="220" height="34" rx="14" fill="#9aa3ad"/>
        <circle cx="140" cy="300" r="42" fill="#2b2d42" stroke="#111" stroke-width="5"/>
        <circle cx="140" cy="300" r="26" fill="#ffd23f"/>
        <text x="140" y="316" font-size="34" font-weight="900" fill="#111" text-anchor="middle" font-family="Arial Black, Arial, sans-serif">$</text>
        <!-- neck -->
        <rect x="115" y="180" width="50" height="36" fill="#9aa3ad" stroke="#111" stroke-width="5"/>
        <!-- head -->
        <rect x="20" y="30" width="240" height="160" rx="30" fill="#dfe5ea" stroke="#111" stroke-width="6"/>
        <!-- antenna -->
        <line x1="140" y1="30" x2="140" y2="-12" stroke="#111" stroke-width="6"/>
        <circle cx="140" cy="-20" r="12" fill="#e63946" stroke="#111" stroke-width="4"/>
        <!-- sunglasses -->
        <rect x="42" y="78" width="80" height="46" rx="10" fill="#111"/>
        <rect x="158" y="78" width="80" height="46" rx="10" fill="#111"/>
        <rect x="122" y="94" width="36" height="10" fill="#111"/>
        <line x1="52" y1="88" x2="72" y2="114" stroke="#fff" stroke-width="5"/>
        <line x1="168" y1="88" x2="188" y2="114" stroke="#fff" stroke-width="5"/>
        <!-- smug smile -->
        <path d="M 95 155 Q 140 178 185 155" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
        <!-- arm holding boarding pass -->
        <rect x="238" y="230" width="26" height="110" rx="12" fill="#9aa3ad" stroke="#111" stroke-width="5" transform="rotate(-38 250 280)"/>
        <g transform="translate(300,120) rotate(12)">
          <rect x="0" y="0" width="150" height="96" rx="8" fill="#fff" stroke="#111" stroke-width="4"/>
          <text x="12" y="26" font-size="17" font-weight="900" fill="#111" font-family="Arial Black, Arial, sans-serif">BOARDING</text>
          <text x="12" y="46" font-size="17" font-weight="900" fill="#111" font-family="Arial Black, Arial, sans-serif">PASS</text>
          <line x1="12" y1="58" x2="138" y2="58" stroke="#111" stroke-width="3" stroke-dasharray="6 4"/>
          <text x="12" y="82" font-size="15" font-weight="900" fill="#e63946" font-family="Arial Black, Arial, sans-serif">NOWHERE ✈</text>
        </g>
      </g>
    </svg>

    <div class="bubble">You&rsquo;re<br>welcome.</div>
  </div>

  <div class="band bottom">
    <div class="t1">SO IT BOOKED A FLIGHT, A HOTEL AND A CAR.</div>
    <div class="t2">OUT OF OFFICE FOREVER.</div>
  </div>
</body>
</html>
